<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

  body {
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #0d0d0d 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e0e0e0;
    padding: 20px;
  }

  .container {
    background: linear-gradient(145deg, #2a2a2a, #181818);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 1.7rem;
    margin-bottom: 30px;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(255,255,255,0.08);
    font-weight: 600;
  }

  .btn {
    background: linear-gradient(145deg, #3a3a3a, #222);
    color: #fff;
    border: 1px solid #555;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    letter-spacing: 1px;
  }

  .btn:hover {
    background: linear-gradient(145deg, #4a4a4a, #2a2a2a);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.6);
    border-color: #777;
  }

  .btn:active { transform: translateY(0) scale(0.98); }

  #captchaSection, #providerSection {
    display: none;
    margin-top: 25px;
  }

  #captchaSection.active, #providerSection.active {
    display: block;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .captcha-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .fake-captcha {
    background: #1f1f1f;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    width: 300px;
    height: 68px;
    transition: border-color 0.2s ease, background 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .fake-captcha:hover {
    border-color: #777;
    background: #242424;
  }

  .fake-captcha.verified {
    cursor: default;
    border-color: #22c55e;
    background: #1a1a1a;
  }

  .fc-checkbox {
    width: 26px;
    height: 26px;
    border: 2px solid #888;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    position: relative;
    transition: border-color 0.2s ease;
    flex-shrink: 0;
  }

  .fake-captcha:hover .fc-checkbox { border-color: #ccc; }
  .fake-captcha.verifying .fc-checkbox { border-color: #f0b429; }
  .fake-captcha.verified .fc-checkbox {
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.08);
  }

  .fc-checkbox svg {
    width: 18px;
    height: 18px;
    position: absolute;
  }

  #fcSpinner { display: none; }
  #fcCheck { display: none; }

  .fake-captcha.verifying #fcSpinner { display: block; }
  .fake-captcha.verified #fcCheck { display: block; }

  .fc-label {
    color: #e5e5e5;
    font-size: 0.85rem;
    letter-spacing: 0.2px;
    font-weight: 400;
  }

  .fake-captcha.verified .fc-label { color: #22c55e; }

  .providers {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .provider-btn {
    background: linear-gradient(145deg, #333, #1c1c1c);
    border: 1px solid #555;
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: all 0.2s ease;
    user-select: none;
    min-height: 80px;
  }

  .provider-btn:hover {
    background: linear-gradient(145deg, #454545, #252525);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    border-color: #777;
  }

  .provider-btn:active { transform: scale(0.97); }

  /* Imagem grande (Linkvertise) */
  .linkvertise-btn img {
    max-height: 56px;
    max-width: 220px;
    width: auto;
    height: auto;
    object-fit: contain;
    mix-blend-mode: screen;
  }

  /* Imagem pequena (Loot Labs) */
  .lootlabs-btn img {
    width: auto;
    height: 30px;
    object-fit: contain;
    mix-blend-mode: screen;
  }

  /* Texto ao lado da imagem */
  .lootlabs-btn span {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }

  footer {
    margin-top: 45px;
    text-align: center;
    color: #888;
    font-size: 0.88rem;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>KEY SYSTEM</h1>

  <button class="btn" id="selectBtn" onclick="showCaptcha()">Select Provider</button>

  <div id="captchaSection">
    <div class="captcha-wrap">
      <div class="fake-captcha" id="fakeCaptcha" onclick="fakeVerify()">
        <div class="fc-checkbox" id="fcCheckbox">
          <svg class="fc-spinner" viewBox="0 0 50 50" id="fcSpinner">
            <circle cx="25" cy="25" r="20" fill="none" stroke="#f0b429" stroke-width="5"
                    stroke-dasharray="90 150" stroke-linecap="round">
              <animateTransform attributeName="transform" type="rotate"
                                from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/>
            </circle>
          </svg>
          <svg class="fc-check" viewBox="0 0 24 24" id="fcCheck">
            <path d="M5 13l4 4L19 7" fill="none" stroke="#22c55e" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="fc-label" id="fcLabel">Verify you are human</span>
      </div>
    </div>
  </div>

  <div id="providerSection">
    <div class="providers">
      <!-- Botão 1: Linkvertise (imagem grande) -->
      <div class="provider-btn linkvertise-btn" onclick="goLinkvertise()">
        <img src="https://github.com/user-attachments/assets/2fba3982-2f29-449e-ab24-9b5702c8dff8" alt="Linkvertise">
      </div>
      <!-- Botão 2: Loot Labs (imagem pequena + texto) -->
      <div class="provider-btn lootlabs-btn" onclick="goLootlabs()">
        <img src="https://github.com/user-attachments/assets/ac69add3-349f-4454-905e-2e9b29e7b1a0" alt="Loot Labs">
        <span>Loot Labs</span>
      </div>
    </div>
  </div>
</div>

<footer>
  <span>Powered by DeepSeek</span>
</footer>

<script>
  let audioCtx = null;
  function playClick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.15);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
      filter.Q.value = 0.7;

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);

      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(880, ctx.currentTime);
      osc2.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.1);

      gain2.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.025, ctx.currentTime + 0.008);
      gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);

      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(ctx.currentTime);
      osc2.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }

  function showCaptcha() {
    playClick();
    document.getElementById('selectBtn').style.display = 'none';
    document.getElementById('captchaSection').classList.add('active');
  }

  function fakeVerify() {
    const box = document.getElementById('fakeCaptcha');
    if (box.classList.contains('verifying') || box.classList.contains('verified')) return;

    playClick();
    box.classList.add('verifying');
    document.getElementById('fcLabel').textContent = 'Verifying...';

    setTimeout(() => {
      box.classList.remove('verifying');
      box.classList.add('verified');
      document.getElementById('fcLabel').textContent = 'Success!';

      setTimeout(() => {
        onCaptchaSuccess('fake-token-' + Date.now());
      }, 400);
    }, 1200);
  }

  function onCaptchaSuccess(token) {
    playClick();
    console.log('Captcha token:', token);
    document.getElementById('captchaSection').classList.remove('active');
    document.getElementById('providerSection').classList.add('active');
  }

  function goLootlabs() {
    playClick();
    setTimeout(() => {
      window.open('https://loot-link.com/s?xnmmOZhy', '_blank');
    }, 220);
  }

  function goLinkvertise() {
    playClick();
    setTimeout(() => {
      window.open('https://direct-link.net/1460648/jVdKhu6gf4cP', '_blank');
    }, 220);
  }
</script>

</body>
</html>
