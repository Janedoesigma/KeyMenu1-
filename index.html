<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

  body {
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #0d0d0d 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e0e0e0;
    padding: 20px;
  }

  .container {
    background: linear-gradient(145deg, #2a2a2a, #181818);
    border: 1px solid #444;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 1.7rem;
    margin-bottom: 30px;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(255,255,255,0.08);
    font-weight: 600;
  }

  .btn {
    background: linear-gradient(145deg, #3a3a3a, #222);
    color: #fff;
    border: 1px solid #555;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    letter-spacing: 1px;
  }

  .btn:hover {
    background: linear-gradient(145deg, #4a4a4a, #2a2a2a);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.6);
    border-color: #777;
  }

  .btn:active { transform: translateY(0) scale(0.98); }

  .section {
    display: none;
    margin-top: 25px;
  }

  .section.active {
    display: block;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .captcha-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .fake-captcha {
    background: #1f1f1f;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    width: 300px;
    height: 68px;
    transition: border-color 0.2s ease, background 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .fake-captcha:hover {
    border-color: #777;
    background: #242424;
  }

  .fake-captcha.verified {
    cursor: default;
    border-color: #22c55e;
    background: #1a1a1a;
  }

  .fc-checkbox {
    width: 26px;
    height: 26px;
    border: 2px solid #888;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    position: relative;
    transition: border-color 0.2s ease;
    flex-shrink: 0;
  }

  .fake-captcha:hover .fc-checkbox { border-color: #ccc; }
  .fake-captcha.verifying .fc-checkbox { border-color: #f0b429; }
  .fake-captcha.verified .fc-checkbox {
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.08);
  }

  .fc-checkbox svg {
    width: 18px;
    height: 18px;
    position: absolute;
  }

  #fcSpinner, #googleSpinner { display: none; }
  #fcCheck, #googleCheck { display: none; }

  .fake-captcha.verifying #fcSpinner { display: block; }
  .fake-captcha.verified #fcCheck { display: block; }
  .google-captcha.verifying #googleSpinner { display: block; }
  .google-captcha.verified #googleCheck { display: block; }

  .fc-label {
    color: #e5e5e5;
    font-size: 0.85rem;
    letter-spacing: 0.2px;
    font-weight: 400;
    text-align: left;
  }

  .fake-captcha.verified .fc-label { color: #22c55e; }

  .providers {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .provider-btn {
    background: linear-gradient(145deg, #333, #1c1c1c);
    border: 1px solid #555;
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: all 0.2s ease;
    user-select: none;
    min-height: 80px;
  }

  .provider-btn:hover {
    background: linear-gradient(145deg, #454545, #252525);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    border-color: #777;
  }

  .provider-btn:active { transform: scale(0.97); }

  .linkvertise-btn img {
    max-height: 56px;
    max-width: 220px;
    width: auto;
    height: auto;
    object-fit: contain;
    mix-blend-mode: screen;
  }

  .lootlabs-btn img {
    width: auto;
    height: 30px;
    object-fit: contain;
    mix-blend-mode: screen;
  }

  .lootlabs-btn span {
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .key-box {
    background: #1f1f1f;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    color: #22c55e;
    font-size: 0.9rem;
    word-break: break-all;
    margin-bottom: 15px;
  }

  footer {
    margin-top: 45px;
    text-align: center;
    color: #888;
    font-size: 0.88rem;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>KEY SYSTEM</h1>

  <!-- Tela Inicial: Selecionar Provedor -->
  <button class="btn" id="selectBtn" onclick="showCaptcha()">Select Provider</button>

  <!-- Seção 1: Captcha Humano Inicial -->
  <div class="section" id="captchaSection">
    <div class="captcha-wrap">
      <div class="fake-captcha" id="fakeCaptcha" onclick="fakeVerify()">
        <div class="fc-checkbox" id="fcCheckbox">
          <svg class="fc-spinner" viewBox="0 0 50 50" id="fcSpinner">
            <circle cx="25" cy="25" r="20" fill="none" stroke="#f0b429" stroke-width="5"
                    stroke-dasharray="90 150" stroke-linecap="round">
              <animateTransform attributeName="transform" type="rotate"
                                from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/>
            </circle>
          </svg>
          <svg class="fc-check" viewBox="0 0 24 24" id="fcCheck">
            <path d="M5 13l4 4L19 7" fill="none" stroke="#22c55e" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="fc-label" id="fcLabel">Verify you are human</span>
      </div>
    </div>
  </div>

  <!-- Seção 2: Escolha de Provedores (Linkvertise / Loot Labs) -->
  <div class="section" id="providerSection">
    <div class="providers">
      <div class="provider-btn linkvertise-btn" onclick="goLinkvertise()">
        <img src="https://github.com/user-attachments/assets/2fba3982-2f29-449e-ab24-9b5702c8dff8" alt="Linkvertise">
      </div>
      <div class="provider-btn lootlabs-btn" onclick="goLootlabs()">
        <img src="https://github.com/user-attachments/assets/ac69add3-349f-4454-905e-2e9b29e7b1a0" alt="Loot Labs">
        <span>Loot Labs</span>
      </div>
    </div>
  </div>

  <!-- Seção 3: Verificação da Conta Google (Aparece ao retornar do link) -->
  <div class="section" id="googleVerifySection">
    <div class="captcha-wrap">
      <div class="fake-captcha google-captcha" id="googleCaptcha" onclick="googleVerify()">
        <div class="fc-checkbox" id="googleCheckbox">
          <svg class="fc-spinner" viewBox="0 0 50 50" id="googleSpinner">
            <circle cx="25" cy="25" r="20" fill="none" stroke="#f0b429" stroke-width="5"
                    stroke-dasharray="90 150" stroke-linecap="round">
              <animateTransform attributeName="transform" type="rotate"
                                from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/>
            </circle>
          </svg>
          <svg class="fc-check" viewBox="0 0 24 24" id="googleCheck">
            <path d="M5 13l4 4L19 7" fill="none" stroke="#22c55e" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="fc-label" id="googleLabel">Verificar Conta Google</span>
      </div>
    </div>
  </div>

  <!-- Seção 4: Geração de Chave -->
  <div class="section" id="generateKeySection">
    <div class="key-box" id="keyDisplay">Click below to generate your key</div>
    <button class="btn" id="generateBtn" onclick="generateKey()">Gerar Key</button>
    <button class="btn" id="copyBtn" onclick="copyKey()" style="margin-top: 10px; display: none; background: linear-gradient(145deg, #166534, #14532d);">Copiar Key</button>
  </div>
</div>

<footer>
  <span>Powered by DeepSeek</span>
</footer>

<script>
  let audioCtx = null;
  function playClick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.15);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1200, ctx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
      filter.Q.value = 0.7;

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  }

  // Verifica se o usuário retornou de um link externo via parâmetro ou localStorage
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const fromLink = urlParams.get('from');

    if (fromLink) {
      localStorage.setItem('waiting_verification', 'true');
      // Limpa a URL para o usuário não ficar preso ao atualizar
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (localStorage.getItem('waiting_verification') === 'true') {
      document.getElementById('selectBtn').style.display = 'none';
      document.getElementById('googleVerifySection').classList.add('active');
    }
  });

  function showCaptcha() {
    playClick();
    document.getElementById('selectBtn').style.display = 'none';
    document.getElementById('captchaSection').classList.add('active');
  }

  function fakeVerify() {
    const box = document.getElementById('fakeCaptcha');
    if (box.classList.contains('verifying') || box.classList.contains('verified')) return;

    playClick();
    box.classList.add('verifying');
    document.getElementById('fcLabel').textContent = 'Verifying...';

    setTimeout(() => {
      box.classList.remove('verifying');
      box.classList.add('verified');
      document.getElementById('fcLabel').textContent = 'Success!';

      setTimeout(() => {
        document.getElementById('captchaSection').classList.remove('active');
        document.getElementById('providerSection').classList.add('active');
      }, 400);
    }, 1200);
  }

  function goLootlabs() {
    playClick();
    setTimeout(() => {
      // Adiciona parâmetro na URL atual para sabermos que ele foi para o Lootlabs
      const returnUrl = window.location.origin + window.location.pathname + '?from=lootlabs';
      window.location.href = 'https://loot-link.com/s?xnmmOZhy'; // Redireciona na mesma aba ou use window.open se preferir
    }, 220);
  }

  function goLinkvertise() {
    playClick();
    setTimeout(() => {
      const returnUrl = window.location.origin + window.location.pathname + '?from=linkvertise';
      window.location.href = 'https://direct-link.net/1460648/jVdKhu6gf4cP';
    }, 220);
  }

  function googleVerify() {
    const box = document.getElementById('googleCaptcha');
    if (box.classList.contains('verifying') || box.classList.contains('verified')) return;

    playClick();
    box.classList.add('verifying');
    document.getElementById('googleLabel').textContent = 'Verificando Conta Google...';

    setTimeout(() => {
      box.classList.remove('verifying');
      box.classList.add('verified');
      document.getElementById('googleLabel').textContent = 'Conta Verificada com Sucesso!';

      localStorage.removeItem('waiting_verification');
      localStorage.setItem('verified_user', 'true');

      setTimeout(() => {
        document.getElementById('googleVerifySection').classList.remove('active');
        document.getElementById('generateKeySection').classList.add('active');
      }, 600);
    }, 1500);
  }

  function generateKey() {
    playClick();
    const baseKey = "%120KEYcbcfbabc8934678";
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$&";
    let randomSuffix = "";
    for (let i = 0; i < 20; i++) {
      randomSuffix += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    const finalKey = baseKey + randomSuffix;
    document.getElementById('keyDisplay').textContent = finalKey;
    document.getElementById('generateBtn').style.display = 'none';
    document.getElementById('copyBtn').style.display = 'block';
  }

  function copyKey() {
    playClick();
    const keyText = document.getElementById('keyDisplay').textContent;
    navigator.clipboard.writeText(keyText).then(() => {
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = 'Copiado!';
      setTimeout(() => {
        copyBtn.textContent = 'Copiar Key';
      }, 2000);
    });
  }
</script>

</body>
</html>
